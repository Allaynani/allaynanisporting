<!DOCTYPE html>
<html lang=ar>
<head>
  <meta charset=UTF-8>
  <title>اتصل بنا</title>
  <style>
    body { font-family: Tahoma, sans-serif; direction: rtl; }
    form { max-width: 400px; margin: auto; }
    input, textarea { width: 100%; margin: 10px 0; padding: 8px; }
    button { background: green; color: white; padding: 10px; border: none; cursor: pointer; }
  </style>
</head>
<body>
  <h2>راسلنا</h2>
  <form action=https://formspree.io/f/mbgdazdk method=POST>
    <label>اسمك:</label>
    <input type="text" name="name" required>
    
    <label>بريدك الإلكتروني:</label>
    <input type=email name=email required>
    
    <label>رسالتك:</label>
    <textarea name=message rows=5 required></textarea>
    
    <!-- بريدك الذي ستستقبل عليه الرسائل -->
    <input type=hidden name=_replyto value=aalaynani@gmail.com>
    
    <button type=submit>إرسال</button>
  </form>
</body>
</html>
